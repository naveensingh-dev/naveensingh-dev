<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>

    <!-- Animated rainbow gradient for name (each stop is offset in phase) -->
    <linearGradient id="ng" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%">
        <animate attributeName="stop-color"
          values="#00E5FF;#FF4081;#7C4DFF;#FFEA00;#00E676;#00BFFF;#00E5FF"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%">
        <animate attributeName="stop-color"
          values="#FF4081;#7C4DFF;#FFEA00;#00E676;#00BFFF;#00E5FF;#FF4081"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%">
        <animate attributeName="stop-color"
          values="#7C4DFF;#FFEA00;#00E676;#00BFFF;#00E5FF;#FF4081;#7C4DFF"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%">
        <animate attributeName="stop-color"
          values="#FFEA00;#00E676;#00BFFF;#00E5FF;#FF4081;#7C4DFF;#FFEA00"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%">
        <animate attributeName="stop-color"
          values="#00E676;#00BFFF;#00E5FF;#FF4081;#7C4DFF;#FFEA00;#00E676"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color"
          values="#00BFFF;#00E5FF;#FF4081;#7C4DFF;#FFEA00;#00E676;#00BFFF"
          dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Background dark gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Glow blur for the main name text -->
    <filter id="glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D depth shadow drop -->
    <filter id="depth" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00ADB5" flood-opacity="0.55"/>
    </filter>

    <!-- Clip path for stars area -->
    <clipPath id="clip">
      <rect width="900" height="300"/>
    </clipPath>

  </defs>

  <!-- Background fill -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Perspective grid - vanishing point at (450, 140) -->
  <g stroke="#00ADB5" stroke-opacity="0.055" stroke-width="1" clip-path="url(#clip)">
    <!-- Horizontal horizon lines -->
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="268" x2="900" y2="268"/>
    <line x1="0" y1="244" x2="900" y2="244"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <!-- Radiating perspective lines from vanishing point -->
    <line x1="0"   y1="300" x2="450" y2="140"/>
    <line x1="75"  y1="300" x2="450" y2="140"/>
    <line x1="150" y1="300" x2="450" y2="140"/>
    <line x1="225" y1="300" x2="450" y2="140"/>
    <line x1="300" y1="300" x2="450" y2="140"/>
    <line x1="375" y1="300" x2="450" y2="140"/>
    <line x1="450" y1="300" x2="450" y2="140"/>
    <line x1="525" y1="300" x2="450" y2="140"/>
    <line x1="600" y1="300" x2="450" y2="140"/>
    <line x1="675" y1="300" x2="450" y2="140"/>
    <line x1="750" y1="300" x2="450" y2="140"/>
    <line x1="825" y1="300" x2="450" y2="140"/>
    <line x1="900" y1="300" x2="450" y2="140"/>
  </g>

  <!-- Circuit-board corner decorations -->
  <g stroke="#00ADB5" stroke-width="1.5" fill="none" opacity="0.25">
    <polyline points="10,10 10,35 35,35"/>
    <polyline points="890,10 890,35 865,35"/>
    <polyline points="10,290 10,265 35,265"/>
    <polyline points="890,290 890,265 865,265"/>
  </g>

  <!-- Circuit traces top-left -->
  <g stroke="#00ADB5" stroke-width="1" stroke-opacity="0.18" fill="none">
    <polyline points="0,55 100,55 120,75 230,75"/>
    <circle cx="230" cy="75" r="3" fill="#00ADB5" opacity="0.4"/>
    <polyline points="0,38 70,38 85,53 140,53"/>
    <circle cx="140" cy="53" r="2" fill="#00ADB5" opacity="0.3"/>
  </g>

  <!-- Circuit traces top-right -->
  <g stroke="#00ADB5" stroke-width="1" stroke-opacity="0.18" fill="none">
    <polyline points="900,60 800,60 780,80 670,80"/>
    <circle cx="670" cy="80" r="3" fill="#00ADB5" opacity="0.4"/>
    <polyline points="900,42 830,42 815,57 760,57"/>
    <circle cx="760" cy="57" r="2" fill="#00ADB5" opacity="0.3"/>
  </g>

  <!-- Floating particles (twinkling stars) -->
  <g fill="#00ADB5">
    <circle cx="55"  cy="35"  r="1.8"><animate attributeName="opacity" values="0;1;0"   dur="2.8s" begin="0s"    repeatCount="indefinite"/><animate attributeName="r" values="1.8;2.5;1.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="80"  r="1.4"><animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="0.7s"  repeatCount="indefinite"/></circle>
    <circle cx="820" cy="45"  r="2.0"><animate attributeName="opacity" values="0;1;0"   dur="2.4s" begin="0.4s"  repeatCount="indefinite"/><animate attributeName="r" values="2;2.8;2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="85"  r="1.5"><animate attributeName="opacity" values="0;0.7;0" dur="4.0s" begin="1.2s"  repeatCount="indefinite"/></circle>
    <circle cx="25"  cy="130" r="1.2"><animate attributeName="opacity" values="0;0.6;0" dur="3.2s" begin="2.1s"  repeatCount="indefinite"/></circle>
    <circle cx="875" cy="120" r="1.2"><animate attributeName="opacity" values="0;0.6;0" dur="2.9s" begin="1.8s"  repeatCount="indefinite"/></circle>
    <circle cx="380" cy="20"  r="1.6"><animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="0.3s"  repeatCount="indefinite"/></circle>
    <circle cx="530" cy="18"  r="1.4"><animate attributeName="opacity" values="0;0.8;0" dur="3.1s" begin="1.5s"  repeatCount="indefinite"/></circle>
    <circle cx="680" cy="30"  r="1.0"><animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="2.5s"  repeatCount="indefinite"/></circle>
    <circle cx="210" cy="25"  r="1.0"><animate attributeName="opacity" values="0;0.5;0" dur="3.6s" begin="3.0s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- 3D name extrusion: stacked offset layers building depth -->
  <text x="458" y="158" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-size="76" font-weight="900" fill="#001619" text-anchor="middle">Naveen Singh</text>
  <text x="456" y="156" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-size="76" font-weight="900" fill="#002b30" text-anchor="middle">Naveen Singh</text>
  <text x="454" y="154" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-size="76" font-weight="900" fill="#004047" text-anchor="middle">Naveen Singh</text>
  <text x="452" y="152" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-size="76" font-weight="900" fill="#005560" text-anchor="middle">Naveen Singh</text>
  <text x="451" y="151" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-size="76" font-weight="900" fill="#006a79" text-anchor="middle">Naveen Singh</text>

  <!-- Main name: animated rainbow gradient + glow + depth shadow -->
  <text x="450" y="150"
        font-family="'Arial Black', 'Impact', Arial, sans-serif"
        font-size="76"
        font-weight="900"
        fill="url(#ng)"
        text-anchor="middle"
        filter="url(#depth)">Naveen Singh</text>

  <!-- White shine overlay for plastic/3D sheen -->
  <text x="450" y="150"
        font-family="'Arial Black', 'Impact', Arial, sans-serif"
        font-size="76"
        font-weight="900"
        text-anchor="middle"
        fill="none"
        stroke="rgba(255,255,255,0.08)"
        stroke-width="1">Naveen Singh</text>

  <!-- Subtitle -->
  <text x="450" y="185"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#8b949e"
        text-anchor="middle"
        letter-spacing="4"
        font-weight="400">SENIOR SOFTWARE DEVELOPER  ·  AI SOLUTION ARCHITECT</text>

  <!-- Stats line -->
  <text x="450" y="215"
        font-family="Arial, sans-serif"
        font-size="12.5"
        fill="#00ADB5"
        text-anchor="middle"
        opacity="0.85"
        letter-spacing="1">9+ Years  ·  50+ Projects  ·  Lighthouse 100/100  ·  📍 Rishikesh, India 🇮🇳</text>

  <!-- Animated separator lines flanking subtitle -->
  <line x1="120" y1="165" x2="340" y2="165" stroke="#00ADB5" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x1" values="120;100;120" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="560" y1="165" x2="780" y2="165" stroke="#00ADB5" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="780;800;780" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Diamond center accent -->
  <polygon points="450,160 455,165 450,170 445,165" fill="#00ADB5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </polygon>

</svg>
